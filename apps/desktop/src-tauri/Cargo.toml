[package]
name = "evara-desktop"
description = "Evara Timetables desktop application."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

# The library holds the app; main.rs is a two-line shim. This is the Tauri 2 layout and
# it keeps the application testable and buildable for mobile targets later.
[lib]
name = "evara_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Native file dialogs for New/Open Project.
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }

# Command handlers delegate into these. Phase 0 wires the dependency graph only;
# no command does real work yet.
evara-core = { workspace = true }
evara-constraints = { workspace = true }
evara-solver = { workspace = true }
evara-db = { workspace = true }
evara-project = { workspace = true }
evara-report = { workspace = true }
