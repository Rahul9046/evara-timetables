[package]
name = "evara-cli"
description = "Headless Evara: solve fixtures, benchmark the solver, inspect and migrate projects."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "evara"
path = "src/main.rs"

[dependencies]
# `fixtures` brings in the deterministic synthetic-school generator that `evara fixture`
# writes out. It is off by default so the desktop binary does not carry it.
evara-core = { workspace = true, features = ["fixtures"] }
evara-constraints = { workspace = true }
evara-solver = { workspace = true }
evara-db = { workspace = true }
evara-project = { workspace = true }
evara-report = { workspace = true }
evara-integrations = { workspace = true }
# Writing a fixture out. Already in the tree, so this adds no new crate and no new licence.
serde_json = { workspace = true }
# `evara validate --project` names a school, a cycle and a term by identifier, so the
# command has to parse one. Already in the tree.
uuid = { workspace = true }
# `evara save` records when a run started and finished. The engine reads no clock, so the
# caller does -- M6's decision -- and a stored timestamp has to be ISO-8601 UTC with
# millisecond precision like every other one. Already in the tree.
time = { workspace = true }

[dev-dependencies]
# `evara validate --project` is tested end to end against a real temporary project, which
# is the only way to prove the read-only open path and the exit codes together.
tempfile = { workspace = true }
