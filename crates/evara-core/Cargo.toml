[package]
name = "evara-core"
description = "Domain types, identifiers, the cycle/calendar time model and scoring primitives."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# TypeScript definitions for the types that cross the IPC boundary. Off by default so the
# solver and the CLI never carry the generator; `evara-typegen` and the desktop crate
# turn it on. See ADR 0012.
ts = ["dep:ts-rs"]
# The deterministic synthetic-school generator in `scheduling::fixtures`. Off by default so
# the desktop binary does not carry test infrastructure; `evara-cli` turns it on for the
# `fixture` command, and the module is also compiled whenever this crate's own tests are
# built, so `cargo test -p evara-core` exercises it with no feature flag.
fixtures = []

[dependencies]
serde = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
thiserror = { workspace = true }
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
# Only the tests need it: this crate's own serde impls are hand-written, and asserting the
# wire format is the point of testing them.
serde_json = { workspace = true }
