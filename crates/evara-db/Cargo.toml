[package]
name = "evara-db"
description = "SQLite persistence: migrations, repositories, problem loading and solution writing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# TypeScript definitions for the record and input types that cross the IPC boundary.
# Off by default so the CLI and the solver never carry the generator. See ADR 0012.
ts = ["dep:ts-rs", "evara-core/ts"]

[dependencies]
evara-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
rusqlite = { workspace = true }
refinery = { workspace = true }
directories = { workspace = true }
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
# For one test only: `tests_import::every_required_field_matches_the_template` reads the
# template's own field list so the copy in `import::evara_import_fields` cannot drift from
# it. A *library* dependency this way round is not allowed -- `evara-import` is the parser
# and knows nothing about SQL -- but a test may read the other crate's answer rather than
# restate it, which is the whole point of the check.
evara-import = { workspace = true }
