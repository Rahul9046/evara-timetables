[workspace]
resolver = "3"
members = [
    "crates/evara-core",
    "crates/evara-db",
    "crates/evara-constraints",
    "crates/evara-solver",
    "crates/evara-project",
    "crates/evara-report",
    "crates/evara-integrations",
    "crates/evara-import",
    "crates/evara-cli",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Tracks the highest MSRV among our dependencies (refinery 0.10 needs 1.92; Tauri 2.12
# needs 1.90). Nobody compiles Evara with an older toolchain — we ship the binary — so a
# conservative MSRV only blocks security updates in the dependency tree.
rust-version = "1.92"
license = "Apache-2.0"
repository = "https://github.com/Rahul9046/evara-timetables"
authors = ["Evara Timetables contributors"]
# Nothing here goes to crates.io; these crates exist only inside this workspace.
publish = false

# Dependency versions live here so every crate stays in step.
# Phase 0 keeps this list minimal: nothing is depended on until the phase that needs it.
[workspace.dependencies]
# Internal crates
evara-core = { path = "crates/evara-core" }
evara-db = { path = "crates/evara-db" }
evara-constraints = { path = "crates/evara-constraints" }
evara-solver = { path = "crates/evara-solver" }
evara-project = { path = "crates/evara-project" }
evara-report = { path = "crates/evara-report" }
evara-integrations = { path = "crates/evara-integrations" }
evara-import = { path = "crates/evara-import" }

# Third party — all MIT / Apache-2.0 / BSD / ISC (see deny.toml)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
# TypeScript definitions generated from the Rust DTOs — ADR 0009 and ADR 0012.
# `uuid-impl` maps `Uuid` to `string`, matching how serde writes it; `no-serde-warnings`
# silences a lint about `serde(default)`, which we use deliberately on optional inputs.
ts-rs = { version = "12", features = ["uuid-impl", "no-serde-warnings"] }

# Persistence. SQLite is statically bundled rather than taken from the host so every
# install runs an identical, known engine version — a desktop app cannot rely on
# whatever SQLite happens to sit on a user's machine.
#
# Every one of these is load-bearing rather than a convenience:
#
# - `functions` registers `evara_site_id()`, which every change-log trigger calls.
# - `backup` is the online backup API. M10 needs it because `VACUUM INTO` is *refused* on a
#   connection carrying `PRAGMA query_only = ON`, which is exactly how a project opened for
#   inspection is configured — so the read-only snapshot path cannot use `VACUUM INTO` at
#   all. It is also the only mechanism that returns control between pages, which is what
#   lets a long copy report progress and observe a cancellation.
# - `limits` caps what a *staged, untrusted* payload can ask the engine for — above all
#   `SQLITE_LIMIT_ATTACHED = 0`, so an `ATTACH` is impossible rather than merely refused.
#
# `hooks` — `progress_handler` — is deliberately **not** enabled. It was the interrupt point
# for a `VACUUM INTO` snapshot, and that mechanism is not on the snapshot path: rusqlite
# requires the handler's closure to be `Send + 'static`, which a borrowed `&dyn Cancel` is
# not, so the stepped backup API carries cancellation instead. A feature nothing calls is a
# compiled surface nobody is testing; it is removed rather than left as a leftover, and the
# reason it is absent is recorded here so re-enabling it is a decision.
#
# All three are no-dependency feature flags in rusqlite's own manifest, so enabling them
# widens the compiled surface and adds nothing to the dependency graph: `cargo deny check`
# is unchanged by this line.
rusqlite = { version = "0.41", features = [
    "bundled",
    "functions",
    "backup",
    "limits",
] }
refinery = { version = "0.10", features = ["rusqlite-bundled"] }
tempfile = "3"
# Platform application-data directories for the settings database.
directories = "6"

# Spreadsheet import — Stage D. All three are pure Rust with no network code, which is
# what `CLAUDE.md` rule 1 requires of anything that ships: an import reads a file the user
# already has, and reaches nothing.
#
# `calamine` reads .xlsx/.xlsb/.ods and legacy .xls. It is a *reader* with no formula
# engine at all, which is the property ADR 0030 §4 depends on rather than a limitation --
# a workbook cannot make Evara evaluate anything. MIT.
#
# The `dates` feature is enabled, which brings `chrono` in behind the parser. A deliberate
# trade, and the alternative was looked at first: without it `calamine` hands over a raw
# Excel serial number, and turning one into a date means implementing the 1900 leap-year
# bug *and* detecting the 1904 epoch. `calamine`'s own `as_datetime` does both
# (`datatype.rs`: "we need to handle both a 1900 and 1904 epoch and we need to account for
# the Excel date bug where it treats 1900 as a leap year"), and getting it wrong shifts a
# leaver's date by four years and a day, silently — precisely the failure this import
# exists to refuse. One well-licensed dependency is a better price than that risk, and
# `chrono` never leaves `evara-import`: a date is rendered to `YYYY-MM-DD` at the parser's
# edge and travels as text, so it is not named in any signature. MIT OR Apache-2.0.
#
# Held at 0.38 or later deliberately, and the floor has moved twice for security reasons.
# Both rounds are recorded because each bound looks arbitrary without its advisory:
#
#   - 0.36 required `zip ^8.6`, and `zip 8.6.0` carries RUSTSEC-2026-0367, -0368 and -0369,
#     three extraction vulnerabilities patched in `zip >= 9.0`. 0.37 was the first release
#     requiring `zip ^9.0`, which is why the floor was 0.37.
#   - 0.37 itself carries **RUSTSEC-2026-0436**, in calamine's own code rather than a
#     dependency's: its Compound File Binary (OLE2) parser indexes fixed offsets into
#     128-byte directory chunks without checking the chunk length, so a directory stream
#     whose length is not a multiple of 128 panics; and its DIFAT loader grows without
#     bounding the chain, so a crafted 512-byte file drives a multi-gigabyte allocation.
#     Denial of service, not memory unsafety — safe Rust turns the out-of-bounds read into
#     a bounds-checked panic. Fixed in 0.38.0 (tafia/calamine#762).
#
# This round is closer to Evara than the `zip` one was. That round's vulnerabilities were in
# `extract` paths `evara-import` never calls; this one is in the reader itself, and the
# advisory names `open_workbook`, `Xls::new` and `Xlsb::new` as the entry points. Evara
# reaches none of the three today: `SourceFormat::of` accepts only `.xlsx` and `.csv` — `.xls`
# and `.xlsb` are an `UnsupportedExtension`, `.xlsm`/`.xltm` a `MacroWorkbook` refusal — and
# the one reader built is `Xlsx::new` over a `Cursor` of bytes already in memory, which is
# what bounds the allocation as well.
#
# That is a property of today's call sites, not of the dependency: the OLE2 parser is compiled
# in whatever Evara calls, `vba_project()` is one call away, and M10 Stage 2 links a ZIP
# reader for real. An unreachable vulnerability is still one `cargo deny` fails on, which is
# the point of the gate. So: do not relax this below 0.38 to avoid an API change.
calamine = { version = "0.38", features = ["dates"] }
# CSV, with the quoting and embedded-newline handling that hand-rolled splitting gets
# wrong. Unlicense OR MIT.
csv = "1"
# Writing the downloadable templates. A template has to format its code columns as *text*
# or Excel helpfully turns `00124` into `124` the moment the school saves it -- the exact
# fidelity failure the import then has to cope with, created by our own template. MIT OR
# Apache-2.0.
#
# Held at 0.100 or later for the same security reason as `calamine` above: 0.99 required
# `zip ^8.3` and so resolved to the advisory-carrying `zip 8.6.0`. 0.100 is the first
# release requiring `zip ^9.0`.
rust_xlsxwriter = { version = "0.102", default-features = false }
# Base64, for the one place binary data crosses the IPC boundary: a school logo. JSON has
# no byte-array type, and serde would otherwise write a 2 MiB image as ~12 MB of decimal
# numbers. Already in the tree as a transitive dependency of tauri, so this adds no new
# crate and no new licence. Apache-2.0 OR MIT.
base64 = "0.23"
# SHA-256, for the `.evara` integrity tree -- M10 Stage 2. `RustCrypto`'s implementation: pure
# Rust, no network code, no C toolchain. Already in the lockfile as a transitive dependency, so
# this adds no crate and no licence. MIT OR Apache-2.0.
sha2 = "0.10"
# The `.evara` container, read and written -- M10 Stage 2. See `crates/evara-project` for why
# `default-features = false` is part of the security argument rather than a size optimisation,
# and `calamine` above for the advisory history that put the floor at 9. MIT.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Lints are declared once and inherited by every crate via `[lints] workspace = true`,
# so `cargo clippy` enforces them even when a contributor forgets `-D warnings`.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Scheduling code is full of deliberate numeric conversions; these fire constantly and
# are better handled by review than by a blanket allow/deny at each site.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# Our docs are prose-heavy and full of proper nouns (SQLite, Tauri, PowerSchool,
# TypeScript, UUIDv7). Backticking each one hurts readability more than it helps.
doc_markdown = "allow"

[profile.release]
# A timetable solver is CPU-bound; prefer whole-program optimisation over build speed.
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev]
# Keeps iteration bearable while still letting the solver run at a usable speed in dev.
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
